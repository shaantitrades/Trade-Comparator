<svg width="180" height="180" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient doré ultra lumineux pour la balance -->
    <linearGradient id="goldGradientApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFF700" stopOpacity="1" />
      <stop offset="25%" stopColor="#FFD700" stopOpacity="1" />
      <stop offset="50%" stopColor="#FFC107" stopOpacity="1" />
      <stop offset="75%" stopColor="#FFA500" stopOpacity="1" />
      <stop offset="100%" stopColor="#FFD700" stopOpacity="1" />
    </linearGradient>
    
    <!-- Effet de brillance/glow pour plus de visibilité -->
    <filter id="glowApple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feFlood floodColor="#FFD700" floodOpacity="0.6"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Ombre améliorée mais plus lumineuse -->
    <filter id="shadowApple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond noir pur -->
  <rect width="120" height="120" fill="#000000" rx="12"/>

  <!-- Halo lumineux autour de la balance pour plus de visibilité -->
  <ellipse
    cx="60"
    cy="55"
    rx="50"
    ry="45"
    fill="#FFD700"
    opacity="0.05"
  />

  <!-- Ombre sous la base -->
  <ellipse
    cx="60"
    cy="115"
    rx="25"
    ry="5"
    fill="#1a1a1a"
    opacity="0.8"
  />

  <!-- Colonne centrale - plus épaisse et lumineuse -->
  <path
    d="M 55 100
       L 55 20
       L 65 20
       L 65 100
       Z
       M 50 100
       L 50 95
       L 70 95
       L 70 100
       Z
       M 58 20
       L 58 15
       L 62 15
       L 62 20
       Z
       M 60 15
       L 60 10
       L 58 10
       L 60 8
       L 62 10
       L 60 10
       Z"
    fill="url(#goldGradientApple)"
    stroke="#FFF700"
    strokeWidth="1"
    filter="url(#glowApple)"
  />

  <!-- Barre horizontale (beam) - plus épaisse et lumineuse -->
  <path
    d="M 20 25
       Q 20 20, 25 20
       L 55 20
       L 65 20
       L 95 20
       Q 100 20, 100 25
       Q 100 30, 95 30
       L 65 30
       L 55 30
       L 25 30
       Q 20 30, 20 25
       Z"
    fill="url(#goldGradientApple)"
    stroke="#FFF700"
    strokeWidth="1"
    filter="url(#glowApple)"
  />

  <!-- Chaînes et plateaux - Côté gauche -->
  <g>
    <!-- Chaînes gauche - plus épaisses et lumineuses -->
    <line x1="25" y1="25" x2="25" y2="40" stroke="url(#goldGradientApple)" strokeWidth="3" filter="url(#glowApple)" />
    <line x1="30" y1="25" x2="30" y2="40" stroke="url(#goldGradientApple)" strokeWidth="3" filter="url(#glowApple)" />
    <line x1="35" y1="25" x2="35" y2="40" stroke="url(#goldGradientApple)" strokeWidth="3" filter="url(#glowApple)" />
    
    <!-- Plateau gauche - plus visible et lumineux -->
    <ellipse
      cx="30"
      cy="45"
      rx="14"
      ry="4.5"
      fill="url(#goldGradientApple)"
      stroke="#FFF700"
      strokeWidth="1"
      filter="url(#glowApple)"
    />
    <path
      d="M 16 45
         Q 16 50, 30 57
         Q 44 50, 44 45
         Q 44 40, 30 45
         Q 16 40, 16 45
         Z"
      fill="url(#goldGradientApple)"
      stroke="#FFF700"
      strokeWidth="1"
      filter="url(#glowApple)"
    />
  </g>

  <!-- Chaînes et plateaux - Côté droit -->
  <g>
    <!-- Chaînes droite - plus épaisses et lumineuses -->
    <line x1="85" y1="25" x2="85" y2="40" stroke="url(#goldGradientApple)" strokeWidth="3" filter="url(#glowApple)" />
    <line x1="90" y1="25" x2="90" y2="40" stroke="url(#goldGradientApple)" strokeWidth="3" filter="url(#glowApple)" />
    <line x1="95" y1="25" x2="95" y2="40" stroke="url(#goldGradientApple)" strokeWidth="3" filter="url(#glowApple)" />
    
    <!-- Plateau droit - plus visible et lumineux -->
    <ellipse
      cx="90"
      cy="45"
      rx="14"
      ry="4.5"
      fill="url(#goldGradientApple)"
      stroke="#FFF700"
      strokeWidth="1"
      filter="url(#glowApple)"
    />
    <path
      d="M 76 45
         Q 76 50, 90 57
         Q 104 50, 104 45
         Q 104 40, 90 45
         Q 76 40, 76 45
         Z"
      fill="url(#goldGradientApple)"
      stroke="#FFF700"
      strokeWidth="1"
      filter="url(#glowApple)"
    />
  </g>
</svg>
